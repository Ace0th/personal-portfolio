{% extends 'base.html' %}{% block title %}Edit portfolio profile | Alamin{% endblock %}{% block body %}<main class="admin-page"><header class="admin-head"><a class="brand" href="{{ url_for('portfolio.dashboard') }}"><span class="brand-icon">a<span>.</span></span><span>alamin<span class="brand-muted">.dev</span></span></a><a class="button secondary" href="{{ url_for('portfolio.dashboard') }}">← Dashboard</a></header><form class="project-editor" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><p class="eyebrow">PROFILE MANAGEMENT</p><h1>Edit profile<span class="accent">.</span></h1>{% if profile.image_path %}<img class="profile-preview" src="{{ profile.image_path }}" alt="Current profile picture">{% endif %}<div class="editor-grid"><label>Full name<input name="full_name" required maxlength="120" value="{{ profile.full_name }}"></label><label>Role / headline<input name="role" required maxlength="160" value="{{ profile.role }}"></label><label class="wide">Introduction<input name="introduction" required maxlength="320" value="{{ profile.introduction }}"></label><label>GitHub URL<input name="github_url" type="url" required value="{{ profile.github_url }}"></label><label>LinkedIn URL<input name="linkedin_url" type="url" required value="{{ profile.linkedin_url }}"></label><label class="wide">Upload/change profile picture<input name="profile_image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label></div><div class="editor-actions"><a class="button secondary" href="{{ url_for('portfolio.dashboard') }}">Cancel</a><button class="button primary" type="submit">Save profile <span>→</span></button></div></form></main>{% endblock %}
