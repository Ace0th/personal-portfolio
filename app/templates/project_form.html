{% extends 'base.html' %}{% block title %}{{ 'Edit' if project.id else 'Add' }} project | Alamin{% endblock %}{% block body %}<main class="admin-page"><header class="admin-head"><a class="brand" href="{{ url_for('portfolio.dashboard') }}"><span class="brand-icon">a<span>.</span></span><span>alamin<span class="brand-muted">.dev</span></span></a><a class="button secondary" href="{{ url_for('portfolio.dashboard') }}">← Dashboard</a></header><form class="project-editor" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><p class="eyebrow">PROJECT MANAGEMENT</p><h1>{{ 'Edit project' if project.id else 'Add a project' }}<span class="accent">.</span></h1><div class="editor-grid"><label>Project name<input name="title" required maxlength="120" value="{{ project.title }}"></label><label>Category<select name="category">{% for c in categories %}<option {{ 'selected' if project.category==c }}>{{ c }}</option>{% endfor %}</select></label><label class="wide">Short description<input name="short_description" required maxlength="240" value="{{ project.short_description }}"></label><label class="wide">Full description<textarea name="full_description" maxlength="8000" rows="5">{{ project.full_description }}</textarea></label><label class="wide">Technologies <small>Comma separated</small><input name="technologies" value="{{ project.technologies|join(', ') }}" placeholder="Python, Flask, SQLAlchemy"></label><label>GitHub URL<input name="github_url" type="url" required value="{{ project.github_url }}"></label><label>Live demo URL<input name="live_url" type="url" value="{{ project.live_url }}"></label><label class="wide">Thumbnail image URL <small>Or upload an image below</small><input name="thumbnail" type="url" value="{{ project.thumbnail if project.thumbnail.startswith('http') else '' }}"></label><label class="wide">Upload/change thumbnail<input name="thumbnail_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><label>Display order<input name="display_order" type="number" min="0" max="10000" value="{{ project.display_order }}"></label><div class="check-row"><label><input type="checkbox" name="featured" {{ 'checked' if project.featured }}> Featured project</label><label><input type="checkbox" name="published" {{ 'checked' if project.published or not project.id }}> Published</label></div></div><div class="editor-actions"><a class="button secondary" href="{{ url_for('portfolio.dashboard') }}">Cancel</a><button class="button primary" type="submit">Save project <span>→</span></button></div></form></main>{% endblock %}
