<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14"><meta name="description" content="{{ profile.full_name|e }} — {{ profile.role|e }}. {{ profile.introduction|e }}">
  <meta property="og:title" content="{{ profile.full_name|e }} | {{ profile.role|e }}"><meta property="og:description" content="Building practical web applications, AI-powered solutions, and meaningful digital experiences.">
  <title>{% block title %}{{ profile.full_name|e }} | {{ profile.role|e }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/site.js') }}"></script>
</head>
<body>{% block body %}{% endblock %}
{% with notices = get_flashed_messages(with_categories=true) %}{% if notices %}<div class="flash-stack" aria-live="polite">{% for kind, message in notices %}<div class="flash {{ kind }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
</body></html>
